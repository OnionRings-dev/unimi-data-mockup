[project]
name = "unimi-data"
version = "0.1.0"
description = "Dati pubblici UniMi per applicazioni studentesche, senza calendari."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "certifi>=2026.2.25",
    "lxml>=6.1.3",
]

[project.scripts]
unimi = "unimi.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unimi"]
